name = "transcribe-worker"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Bind environment variables at deploy time via `wrangler secret put` or Cloudflare dashboard
[vars]
SUPABASE_URL = "https://qtjbjxtujdjvauzwzfkw.supabase.co"
# Public base URL of the web app — used for deep links sent to WhatsApp users.
PUBLIC_SITE_URL = "https://www.transcriu.com"

# Required secrets (set via `wrangler secret put`):
#   SUPABASE_SERVICE_ROLE_KEY     — Supabase service-role JWT
#   WHATSAPP_VERIFY_TOKEN         — random string you also configure in the Meta webhook UI
#   WHATSAPP_ACCESS_TOKEN         — Meta system-user / app access token
#   WHATSAPP_PHONE_NUMBER_ID      — the WABA phone-number-id (NOT the phone number itself)
#   WHATSAPP_APP_SECRET           — Meta app secret (used to verify X-Hub-Signature-256)

# Workers AI binding for Whisper models
[ai]
binding = "AI"

# R2 Storage bindings
[[r2_buckets]]
binding = "AUDIO_FILES"
bucket_name = "transcribe-audio-files"
preview_bucket_name = "transcribe-audio-files-dev"

[[r2_buckets]]
binding = "TRANSCRIPTIONS"
bucket_name = "transcribe-transcriptions"
preview_bucket_name = "transcribe-transcriptions-dev"
# Org logos live in this bucket too, under the `org-images/{orgId}/logo.{ext}` prefix.
# Served publicly via the worker's GET /organization-image/{orgId}.{ext} route.

# Queue bindings
[[queues.producers]]
queue = "transcribe-jobs"
binding = "TRANSCRIBE_JOBS"

[[queues.consumers]]
queue = "transcribe-jobs"
# Process one chunk per message so failures isolate.
max_batch_size = 1
# Run up to N chunks of one audio (or N audios) in parallel.
max_concurrency = 10
# 5 attempts, retries via msg.retry() with our own backoff.
max_retries = 5
# Each invocation should finish well within the worker CPU window for one chunk.
max_batch_timeout = 30
dead_letter_queue = "transcribe-jobs-dlq"

# Dead-letter queue for messages that exhausted retries.
[[queues.producers]]
queue = "transcribe-jobs-dlq"
binding = "TRANSCRIBE_DLQ"

# KV Namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "59f4fed1e83a41de9bcda255a707d3f4"
preview_id = "d4cb1e0a536d45788ff976c3cfa599a0"

# Durable Objects for real-time status
[durable_objects]
bindings = [
  { name = "TRANSCRIPTION_STATUS", class_name = "TranscriptionStatus" }
]

[[migrations]]
tag = "v1"
new_classes = ["TranscriptionStatus"]

# Observability configuration
[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true